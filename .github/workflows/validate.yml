name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit public files
        run: python skills/unisender-skill-factory/scripts/learning_loop.py audit-public --repo-root .
      - name: Validate behavioral eval cases
        run: python skills/unisender-skill-factory/scripts/eval_runner.py validate --cases skills/unisender-skill-factory/evals/cases.json
      - name: Test learning loop
        run: python -m unittest discover -s tests -v
